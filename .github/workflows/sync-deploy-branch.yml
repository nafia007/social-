name: Sync Deploy Branch

# Keep the Prisma compute deployment branch in lockstep with main.
# The deployment builds from prisma/compute-setup/cmsz1h4er22rr2pdtuukqawt5, so we
# fast-forward-merge main into it on every main push. prisma.compute.json lives
# only on that branch and never conflicts, so merges stay clean and the platform
# rebuilds automatically — effectively "tracking main".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge main into deploy branch
        env:
          DEPLOY_BRANCH: prisma/compute-setup/cmsz1h4er22rr2pdtuukqawt5
        run: |
          git fetch origin
          # If the deploy branch doesn't exist remotely yet, create it from main.
          if ! git show-ref --verify --quiet "refs/remotes/origin/$DEPLOY_BRANCH"; then
            git branch "$DEPLOY_BRANCH" origin/main
          fi
          git checkout "$DEPLOY_BRANCH" -- # ensure local ref exists
          git checkout -B "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"
          git merge --no-edit origin/main
          git push origin "$DEPLOY_BRANCH"
