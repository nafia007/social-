name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Dummy-but-valid-format values so the build/typecheck can run without real secrets.
      DATABASE_URL: postgresql://social:social@localhost:5432/social
      REDIS_URL: redis://localhost:6379
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_eyJpbnN0YW5jZUlkIjoiaW5zdF9oYWwiLCJmcm9udGVuZEFwaSI6ImhhbC5jbGVyay5hY2NvdW50cy5kZXYifQ==
      CLERK_SECRET_KEY: sk_test_dummy
      ENCRYPTION_KEY: "12345678901234567890123456789012"
      X_CLIENT_ID: x
      X_CLIENT_SECRET: x
      X_REDIRECT_URI: http://localhost:3000/api/auth/callback/x
      LINKEDIN_CLIENT_ID: l
      LINKEDIN_CLIENT_SECRET: l
      LINKEDIN_REDIRECT_URI: http://localhost:3000/api/auth/callback/linkedin
      META_APP_ID: m
      META_APP_SECRET: m
      META_REDIRECT_URI: http://localhost:3000/api/auth/callback/meta
      CRON_SECRET: ci-secret

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma validate
        run: npx prisma validate

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npx next build
